name: Dependency Check (ARM)

on:
  push:
  pull_request:

jobs:
  depcheck:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'NodeApp'
          path: '.'
          format: 'HTML'
          out: 'reports'
