name: Validate Multi-Arch Dependency Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Test on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show architecture
        run: uname -m

      - name: Create dummy Node project (for testing)
        run: |
          mkdir nodeapp
          cd nodeapp
          npm init -y
          echo "console.log('Hello');" > index.js

      - name: Run Dependency Check from GHCR
        run: |
          mkdir -p reports
          podman run --rm -v $PWD:/src ghcr.io/poorneshorg/dependency-check:multiarch \
            --project "GHCR-${{ matrix.arch }}" \
            --scan /src/nodeapp \
            --format HTML \
            --out /src/reports

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-${{ matrix.arch }}
          path: reports/
